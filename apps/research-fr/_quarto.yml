project:
  type: website
  output-dir: ../web/public/research/fr
  render:
    - index.qmd
    - articles/**/*.qmd

website:
  title: "Recherche Mayo Kadanga"
  navbar: false
  search: false

lang: fr
bibliography: references.bib
execute:
  freeze: auto

format:
  html:
    theme: none
    css: styles/research.css
    include-before-body: includes/header.html
    toc: true
    toc-title: "Sur cette page"
    number-sections: true
    code-fold: true
    code-tools: false
    anchor-sections: true
    html-math-method: mathml
    highlight-style: github
    fig-responsive: true
