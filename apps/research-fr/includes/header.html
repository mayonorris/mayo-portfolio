<header class="article-header" role="banner"><div class="article-header__inner"><div class="article-brand"><strong>Mayo Kadanga</strong><span>ISE · DATA SCIENTIST</span></div><nav class="article-nav" aria-label="Navigation de l’article"><a data-portfolio-href="/fr/recherche" href="/fr/recherche">Retour à la recherche</a><a data-locale-link href="/en/research">EN</a><button class="article-theme-toggle" type="button" aria-label="Changer le thème de l’article" data-theme-toggle><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button></nav></div></header>
<script>
(function () {
  var root = document.documentElement;
  var key = "mayo-portfolio-theme";
  var button = document.querySelector("[data-theme-toggle]");
  var localeLink = document.querySelector("[data-locale-link]");
  var articleRoutes = { "inclusion-financiere-pauvrete-multidimensionnelle": "/en/research/financial-inclusion-multidimensional-poverty" };
  var routeKey = Object.keys(articleRoutes).find(function (slug) { return location.pathname.indexOf(slug) !== -1; });

  if (localeLink && routeKey) localeLink.setAttribute("href", articleRoutes[routeKey]);

  function apply(theme) {
    root.setAttribute("data-article-theme", theme);
    if (button) button.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  }

  var stored = window.localStorage ? localStorage.getItem(key) : null;
  var systemTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  apply(stored === "light" || stored === "dark" ? stored : systemTheme);

  document.querySelectorAll("[data-portfolio-href]").forEach(function (link) { link.setAttribute("href", link.getAttribute("data-portfolio-href")); });

  if (button) {
    button.addEventListener("click", function () {
      var current = root.getAttribute("data-article-theme");
      var next = current === "dark" ? "light" : "dark";
      apply(next);
      if (window.localStorage) localStorage.setItem(key, next);
    });
  }
}());
</script>
