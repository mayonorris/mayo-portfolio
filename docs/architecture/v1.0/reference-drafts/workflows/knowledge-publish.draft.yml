name: Knowledge Build

on:
  pull_request:
    paths:
      - "apps/knowledge/**"
      - "packages/design-tokens/**"
      - ".github/workflows/knowledge-publish.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/knowledge/**"
      - "packages/design-tokens/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Render English
        run: quarto render apps/knowledge/en

      - name: Render French
        run: quarto render apps/knowledge/fr

      - name: Assemble static artifact
        run: |
          mkdir -p apps/knowledge/dist/en apps/knowledge/dist/fr
          cp -R apps/knowledge/en/_site/. apps/knowledge/dist/en/
          cp -R apps/knowledge/fr/_site/. apps/knowledge/dist/fr/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/knowledge/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
